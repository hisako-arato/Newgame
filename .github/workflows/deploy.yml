# main が変わったら、遊べる版（https://unjou-requiem.haruki-atmark.workers.dev）を自動で更新する。
# スマホ（クラウドの Claude）で直した分も、PC を開かずにスマホのアプリへ届けるため。
#
# GitHub の Secrets に CLOUDFLARE_API_TOKEN が要る（haitomoshibi と同じものでよい。手順は README）。
# まだ無いあいだは、検査だけ回して上げずに終わる。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: データの検査
        run: node tests/check-data.js
      - name: 公開物を集める
        run: node tools/build-pages.js
      - name: Cloudflare に上げる
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN がまだ無いので、上げずに終わる"
            exit 0
          fi
          # 貼るときに紛れこんだ空白・改行を取り除く（スマホで写すと入りやすい）
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          # トークンが使えるか、どのアカウントに使えるかを先に確かめる（トークンの中身は出さない）
          api /user/tokens/verify | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{const j=JSON.parse(t);console.log("トークン:",j.success?"有効":"無効",JSON.stringify(j.errors||[]))})'
          # アカウントの番号は書きこまず、トークンで見えるアカウントを使う
          # （書きこんだ番号とトークンのアカウントが食いちがって、2026-11-15 に「認証エラー」で止まったため）
          CLOUDFLARE_ACCOUNT_ID="$(api '/accounts?per_page=50' | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{const j=JSON.parse(t);const a=j.result||[];console.error("このトークンで見えるアカウント: "+a.length+" 件"+(j.success?"":" "+JSON.stringify(j.errors)));a.forEach(x=>console.error("  - "+x.name+"（"+x.id+"）"));if(a.length)console.log(a[0].id)})')"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::このトークンで使えるアカウントがない。Cloudflare でトークンを作るとき、Account Resources に自分のアカウントを入れる"
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID
          echo "上げる先のアカウント: $CLOUDFLARE_ACCOUNT_ID"
          npx -y wrangler@4 deploy
