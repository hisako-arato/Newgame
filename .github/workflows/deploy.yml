# main が変わったら、遊べる版（https://unjou-requiem.haruki-rog.workers.dev）を自動で更新する。
# スマホ（クラウドの Claude）で直した分も、PC を開かずにスマホのアプリへ届けるため。
#
# GitHub の Secrets に CLOUDFLARE_API_TOKEN が要る（haitomoshibi と同じものでよい。手順は README）。
# まだ無いあいだは、検査だけ回して上げずに終わる。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: データの検査
        run: node tests/check-data.js
      - name: 公開物を集める
        run: node tools/build-pages.js
      - name: Cloudflare に上げる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 62b2208f5b8cb3f0933d82e0fd012db9
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN がまだ無いので、上げずに終わる"
            exit 0
          fi
          npx -y wrangler@4 deploy
