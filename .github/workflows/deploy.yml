# main が変わったら、遊べる版（https://unjou-requiem.haruki-rog.workers.dev）を自動で更新する。
# スマホ（クラウドの Claude）で直した分も、PC を開かずにスマホのアプリへ届けるため。
#
# GitHub の Secrets に CLOUDFLARE_API_TOKEN が要る（haitomoshibi と同じものでよい。手順は README）。
# まだ無いあいだは、検査だけ回して上げずに終わる。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: データの検査
        run: node tests/check-data.js
      - name: 公開物を集める
        run: node tools/build-pages.js
      - name: Cloudflare に上げる
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 62b2208f5b8cb3f0933d82e0fd012db9
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN がまだ無いので、上げずに終わる"
            exit 0
          fi
          # 貼るときに紛れこんだ空白・改行を取り除く（スマホで写すと入りやすい）
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          # 上げる前に、トークンが使えるかを Cloudflare に問い合わせる（中身は出さない。断られたら理由だけ出す）
          echo "トークンの長さ: ${#CLOUDFLARE_API_TOKEN} 文字（空白を除いた分。ふつうは40文字前後）"
          for url in "https://api.cloudflare.com/client/v4/user/tokens/verify" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            echo "問い合わせ: $url"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{try{const j=JSON.parse(t);console.log("  使える:",j.success,"/ 状態:",(j.result||{}).status||"-","/ 理由:",JSON.stringify(j.errors||[]))}catch(e){console.log("  応答を読めなかった")}})'
          done
          npx -y wrangler@4 deploy
