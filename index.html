<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>雲上のレクイエム</title>
<meta name="theme-color" content="#0b0d16">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雲上">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Old+Mincho:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <div id="stage">
    <canvas id="view" width="176" height="176"></canvas>
  </div>
  <div id="hud">
    <div id="hudText">
      <div id="goal"></div>
      <div id="stat"></div>
    </div>
    <button id="btnMenu" type="button">メニュー</button>
  </div>
  <div id="mapname"></div>
  <div id="stick" hidden><div id="stickKnob"></div></div>
  <div id="fade"></div>

  <div id="battle" hidden>
    <div id="bName"></div>
    <div id="bHp"><div id="bHpBar"></div></div>
    <div id="bEnemy"><canvas id="bCanvas" width="64" height="64"></canvas></div>
    <div id="bLog"></div>
    <div id="bHero"></div>
  </div>

  <div id="msg" hidden>
    <div id="msgName"></div>
    <div id="msgText"></div>
    <div id="msgNext">▼</div>
  </div>
  <div id="list" hidden></div>
  <div id="flashFx"></div>

  <div id="card" hidden></div>
  <div id="title">
    <div class="moon"></div>
    <p class="lead">ある薬売りと、その弟子の物語</p>
    <h1>雲上のレクイエム</h1>
    <p class="chapter">全三章</p>
    <div class="titleBtns">
      <button id="btnContinue" type="button">つづきから</button>
      <button id="btnNew" type="button">はじめから</button>
    </div>
  </div>
</div>
<!--/APP-->
<script src="js/core.js"></script>
<script src="data/items.js"></script>
<script src="data/monsters.js"></script>
<script src="data/monsters2.js"></script>
<script src="data/maps.js"></script>
<script src="data/maps2.js"></script>
<script src="data/maps3.js"></script>
<script src="data/story.js"></script>
<script src="data/story2.js"></script>
<script src="data/story3.js"></script>
<script src="data/story4.js"></script>
<script src="js/sprites.js"></script>
<script src="js/ui.js"></script>
<script src="js/script.js"></script>
<script src="js/field.js"></script>
<script src="js/battle.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
<script>
  // アプリとして入れたときに、電波がなくても遊べるようにする（https で開いたときだけ。手元の確認では登録しない）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(function (r) { r.update(); }).catch(function () {});
  }
</script>
</body>
</html>
